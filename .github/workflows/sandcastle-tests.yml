---
name: Sandcastle Tests
# Type-checks Sandcastle's orchestration code (.sandcastle/) and runs its tests
# on every PR that changes it or the root package files, as the local gate's
# .github/ci/gate-checks.sh does. A workflow of its own, not a step of
# ci.yml's Build Solution job: Detect Changes counts every .md file as docs, so
# a PR that only edits a .sandcastle/*-prompt.md would skip that job, and
# prompts.test.mts is what checks the prompts. Not a required check, but a
# failing run leaves the PR UNSTABLE, which PR Auto-Merge waits on.

"on":
  pull_request:
    branches:
      - "main"
    paths:
      - ".sandcastle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandcastle-tests:
    name: Sandcastle tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Corepack provides the pnpm version pinned by "packageManager" in
      # package.json.
      - name: Install packages
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Type-check and test
        run: pnpm run test:sandcastle
